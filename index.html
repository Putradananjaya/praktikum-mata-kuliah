<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praktikum Virtual</title>
<style>
:root{--bg:#111113;--text:#e8e8ea;--muted:#9a9aa2;color-scheme:dark}
@media (prefers-color-scheme: light){:root{--bg:#f5f5f7;--text:#18181b;--muted:#5c5c66;color-scheme:light}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center}
h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
p{color:var(--muted);font-size:13.5px;line-height:1.6;max-width:420px}
</style>
</head>
<body>
<div>
  <h1>Praktikum Virtual</h1>
  <p>Gunakan tautan mata kuliah yang dibagikan oleh dosen Anda untuk membuka praktikum.</p>
</div>
</body>
</html>
